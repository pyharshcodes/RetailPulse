<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <title>Stop Digging Through Dashboards</title>
  
  <script>
    if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      document.documentElement.classList.add('motion-pending');
      window.__motionTimeout = setTimeout(function() {
        document.documentElement.classList.remove('motion-pending');
      }, 3500);
    }
  </script>

  <style>
    @font-face {
      font-family: "Reference Sans";
      src: local("Reference Sans"), local("MS Reference Sans Serif"), local("Segoe UI"), local("Arial");
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "Reference Display";
      src: local("Reference Display"), local("Reference Sans"), local("Segoe UI Semibold"), local("Arial");
      font-weight: 400 900;
      font-style: normal;
      font-display: swap;
    }

    :root {
      font-family: "Reference Sans", Arial, sans-serif;
      color-scheme: dark;
      --gutter-start: clamp(36px, 4.177vw, 96px);
      --gutter-end: clamp(36px, 4.04vw, 96px);
      --header-top: clamp(20px, 2.264vh, 30px);
      --hero-bottom: clamp(34px, 5.19vh, 64px);
      --display-size: clamp(58px, 7.64vh, 88px);
      --display-leading: clamp(72px, 9.34vh, 106px);
      --copy-size: clamp(14px, 1.70vh, 19px);
      --copy-leading: clamp(19px, 2.17vh, 24px);
      --title-copy-gap: clamp(15px, 2.08vh, 24px);
      --copy-cta-gap: clamp(24px, 3.11vh, 36px);
      --cta-width: clamp(142px, 15.09vh, 168px);
      --cta-height: clamp(38px, 3.96vh, 44px);
      --compact-control-font-size: clamp(17px, 1.75vh, 19px);
      --action-control-font-size: clamp(17px, 1.78vh, 19.5px);
      --primary-control-font-size: clamp(17px, 1.77vh, 19.25px);
      --control-inline-nudge: -1px;
      --control-baseline-shift: clamp(1px, .19vh, 2px);
      --copy-optical-shift: clamp(0px, .1vh, 1px);
      --watch-baseline-shift: clamp(2px, .38vh, 4px);
      --card-width: clamp(150px, 18.96vh, 215px);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      color: #fff;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }

    button, a {
      font-family: inherit;
      color: inherit;
      text-decoration: none;
      transition: filter 140ms ease, opacity 140ms ease;
    }

    button:hover, a:hover {
      filter: brightness(1.08);
    }

    :focus-visible {
      outline: 2px solid #fff;
      outline-offset: 3px;
    }

    .viewport {
      position: fixed;
      inset: 0;
      isolation: isolate;
      background: #000;
      overflow: hidden;
    }

    .screen {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    /* Full-bleed background video */
    .background {
      position: absolute;
      inset: 0;
      z-index: -3;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      pointer-events: none;
      user-select: none;
    }

    /* Screen vignette overlay */
    .screen::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -2;
      pointer-events: none;
      background:
        linear-gradient(180deg, rgba(0,0,0,.03), transparent 24%, transparent 82%, rgba(0,0,0,.05)),
        radial-gradient(ellipse at 44% 54%, transparent 30%, rgba(0,0,0,.055) 100%);
    }

    /* Header Bar */
    .header {
      position: absolute;
      inset: var(--header-top) var(--gutter-end) auto var(--gutter-start);
      height: 48px;
      display: flex;
      align-items: flex-start;
      white-space: nowrap;
      z-index: 20;
    }

    .brand {
      position: relative;
      top: 10px;
      display: inline-flex;
      width: 25px;
      height: 25px;
      filter: drop-shadow(0 1px 2px rgba(0,0,0,.3));
      flex-shrink: 0;
    }

    .header-actions {
      display: flex;
      align-items: flex-start;
      width: 100%;
    }

    .nav {
      display: flex;
      align-items: center;
      margin-left: clamp(36px, 3.03vw, 48px);
      gap: clamp(32px, 2.9vw, 43px);
      position: relative;
      top: 9px;
    }

    .nav-link {
      font-size: 16px;
      font-weight: 430;
      letter-spacing: -.36px;
      color: rgba(229,229,230,.77);
      text-shadow: 0 1px 3px rgba(0,0,0,.55);
      position: relative;
    }

    .nav-link:first-child {
      position: relative;
      top: -3px;
    }

    .nav-link:last-child {
      margin-left: 1px;
    }

    .nav-link.active {
      color: #fff;
    }

    .nav-link.active::after {
      content: "";
      position: absolute;
      bottom: -8px;
      left: 50%;
      transform: translateX(-50%);
      width: 44px;
      height: 2px;
      background: rgba(255,255,255,.82);
      border-radius: 1px;
    }

    .time-panel {
      margin-left: auto;
      width: 211px;
      height: 48px;
      padding-left: 8px;
      border-left: 2px solid rgba(230,230,230,.52);
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .time-label {
      font-size: 15px;
      font-weight: 420;
      color: rgba(240,240,240,.77);
      line-height: 1.15;
    }

    .time-value {
      font-size: 15px;
      font-weight: 440;
      color: rgba(255,255,255,.93);
      line-height: 1.15;
      margin-top: 3px;
      font-variant-numeric: tabular-nums;
    }

    .sign-up {
      width: 109px;
      height: 42px;
      border-radius: 7px;
      background: #fff;
      color: #101010;
      font-size: var(--action-control-font-size);
      font-weight: 460;
      letter-spacing: -.34px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.72), 0 1px 5px rgba(0,0,0,.34);
      margin-left: clamp(20px, 1.95vw, 29px);
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .menu-toggle {
      display: none;
    }

    /* Hero Section */
    .hero {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .hero-content {
      position: absolute;
      left: var(--gutter-start);
      bottom: var(--hero-bottom);
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      z-index: 5;
      pointer-events: auto;
    }

    .hero-title {
      font-family: "Reference Display", "Reference Sans", Arial, sans-serif;
      font-weight: 500;
      font-size: var(--display-size);
      line-height: var(--display-leading);
      font-optical-sizing: auto;
      letter-spacing: -2.1px;
      -webkit-text-stroke: .12px currentColor;
      white-space: nowrap;
      text-shadow: 0 2px 2px rgba(0,0,0,.44);
      margin: 0 0 var(--title-copy-gap) 0;
    }

    .line {
      display: block;
      transform-origin: left center;
      overflow: hidden;
    }

    .line-one {
      color: #fff;
      transform: scaleX(.775);
    }

    .line-two {
      color: rgba(211, 207, 207, .78);
      transform: scaleX(.793);
    }

    .line-reveal {
      display: inline-block;
    }

    .hero-copy {
      color: rgba(226, 229, 228, .84);
      font-size: var(--copy-size);
      line-height: var(--copy-leading);
      font-weight: 350;
      letter-spacing: .13px;
      width: clamp(390px, 31.67vw, 500px);
      left: 1px;
      position: relative;
      text-shadow: 0 1px 3px rgba(0,0,0,.7);
      margin: 0 0 var(--copy-cta-gap) 0;
    }

    .primary-cta {
      width: var(--cta-width);
      height: var(--cta-height);
      border-radius: 7px;
      background: #fff;
      color: #111;
      box-shadow: 0 1px 5px rgba(0,0,0,.38);
      position: relative;
      display: flex;
      align-items: center;
      border: none;
      cursor: pointer;
      flex-shrink: 0;
    }

    .primary-cta .label {
      position: absolute;
      left: 8.125%;
      font-size: var(--primary-control-font-size);
      font-weight: 450;
      letter-spacing: -.3px;
      color: #111;
      top: calc(50% + var(--control-baseline-shift));
      transform: translateY(-50%);
      white-space: nowrap;
    }

    .primary-cta .arrow-box {
      position: absolute;
      right: 3.125%;
      top: 14.286%;
      width: 20.625%;
      height: 71.429%;
      border-radius: 7px;
      background: #070909;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Demo Card */
    .demo-card {
      position: absolute;
      right: var(--gutter-end);
      bottom: var(--hero-bottom);
      width: var(--card-width);
      aspect-ratio: 201 / 265;
      container-type: inline-size;
      z-index: 5;
      pointer-events: auto;
      border: 1px solid rgba(255,255,255,.13);
      border-radius: clamp(12px, 1.52vh, 18px);
      background: linear-gradient(145deg, rgba(24,22,20,.80), rgba(5,12,14,.86));
      box-shadow:
        0 2px 10px rgba(0,0,0,.44),
        0 0 0 3px rgba(255,255,255,.035) inset,
        0 0 0 1px rgba(0,0,0,.9);
      backdrop-filter: blur(14px) saturate(108%);
      -webkit-backdrop-filter: blur(14px) saturate(108%);
      display: flex;
      flex-direction: column;
      padding: 3.5cqw;
      box-sizing: border-box;
    }

    .demo-visual {
      position: relative;
      width: 92.5cqw;
      height: 92cqw;
      border-radius: 4cqw;
      background: #101a1e;
      overflow: hidden;
      margin: 0.5cqw auto 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .demo-visual img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      filter: brightness(.89) saturate(.93) contrast(1.03);
    }

    .demo-visual .play {
      position: absolute;
      width: 29cqw;
      height: 29cqw;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,.34);
      background: rgba(3,5,7,.47);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 2;
      box-shadow: 0 2px 8px rgba(0,0,0,.5);
    }

    .demo-visual .play svg {
      width: 12px;
      height: 14px;
      margin-left: 2px;
    }

    .watch-button {
      width: 100%;
      margin-top: auto;
      height: 26.5cqw;
      border-radius: 3.5cqw;
      border: 1px solid rgba(255,255,255,.21);
      background: linear-gradient(145deg, rgba(26,34,36,.86), rgba(16,29,33,.9));
      color: #fff;
      font-size: clamp(14px, 7.5cqw, 18px);
      font-weight: 430;
      letter-spacing: -.2px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      box-shadow: 0 2px 8px rgba(0,0,0,.35);
    }

    .watch-button span {
      transform: translateY(var(--watch-baseline-shift));
    }

    /* Motion Choreography */
    html.motion-pending .brand {
      opacity: 0;
      transform: translate3d(0, 7px, 0) scale(.94);
      animation: entrance-brand 580ms cubic-bezier(.16,1,.3,1) 60ms forwards;
    }

    html.motion-pending .nav-link:nth-child(1) {
      opacity: 0;
      transform: translate3d(0, 6px, 0);
      animation: entrance-nav 480ms cubic-bezier(.16,1,.3,1) 130ms forwards;
    }

    html.motion-pending .nav-link:nth-child(2) {
      opacity: 0;
      transform: translate3d(0, 6px, 0);
      animation: entrance-nav 480ms cubic-bezier(.16,1,.3,1) 175ms forwards;
    }

    html.motion-pending .nav-link:nth-child(3) {
      opacity: 0;
      transform: translate3d(0, 6px, 0);
      animation: entrance-nav 480ms cubic-bezier(.16,1,.3,1) 220ms forwards;
    }

    html.motion-pending .nav-link:nth-child(4) {
      opacity: 0;
      transform: translate3d(0, 6px, 0);
      animation: entrance-nav 480ms cubic-bezier(.16,1,.3,1) 265ms forwards;
    }

    html.motion-pending .time-panel {
      opacity: 0;
      transform: translate3d(0, 6px, 0);
      animation: entrance-nav 520ms cubic-bezier(.16,1,.3,1) 180ms forwards;
    }

    html.motion-pending .sign-up {
      opacity: 0;
      transform: translate3d(0, 8px, 0) scale(.985);
      animation: entrance-action 520ms cubic-bezier(.16,1,.3,1) 220ms forwards;
    }

    html.motion-pending .menu-toggle {
      opacity: 0;
      transform: translate3d(0, 8px, 0) scale(.985);
      animation: entrance-action 520ms cubic-bezier(.16,1,.3,1) 140ms forwards;
    }

    html.motion-pending .hero-title .line-one .line-reveal {
      transform: translate3d(0, 110%, 0) skewY(2deg);
      animation: entrance-line 800ms cubic-bezier(.22,1,.36,1) 300ms forwards;
    }

    html.motion-pending .hero-title .line-two .line-reveal {
      transform: translate3d(0, 110%, 0) skewY(2deg);
      animation: entrance-line 850ms cubic-bezier(.22,1,.36,1) 440ms forwards;
    }

    html.motion-pending .hero-copy {
      opacity: 0;
      transform: translate3d(0, 8px, 0);
      animation: entrance-copy 620ms cubic-bezier(.16,1,.3,1) 740ms forwards;
    }

    html.motion-pending .primary-cta {
      opacity: 0;
      transform: translate3d(0, 8px, 0) scale(.985);
      animation: entrance-action 560ms cubic-bezier(.16,1,.3,1) 960ms forwards;
    }

    html.motion-pending .demo-card {
      opacity: 0;
      transform: translate3d(0, 12px, 0) scale(.968);
      transform-origin: 82% 50%;
      animation: entrance-card 920ms cubic-bezier(.22,1,.36,1) 1040ms forwards;
    }

    @keyframes entrance-brand {
      from {
        opacity: 0;
        transform: translate3d(0, 7px, 0) scale(.94);
      }
      to {
        opacity: 1;
        transform: translate3d(0, 0, 0) scale(1);
      }
    }

    @keyframes entrance-nav {
      from {
        opacity: 0;
        transform: translate3d(0, 6px, 0);
      }
      to {
        opacity: 1;
        transform: translate3d(0, 0, 0);
      }
    }

    @keyframes entrance-action {
      from {
        opacity: 0;
        transform: translate3d(0, 8px, 0) scale(.985);
      }
      to {
        opacity: 1;
        transform: translate3d(0, 0, 0) scale(1);
      }
    }

    @keyframes entrance-line {
      from {
        transform: translate3d(0, 110%, 0) skewY(2deg);
      }
      to {
        transform: translate3d(0, 0, 0) skewY(0deg);
      }
    }

    @keyframes entrance-copy {
      from {
        opacity: 0;
        transform: translate3d(0, 8px, 0);
      }
      to {
        opacity: 1;
        transform: translate3d(0, 0, 0);
      }
    }

    @keyframes entrance-card {
      from {
        opacity: 0;
        transform: translate3d(0, 12px, 0) scale(.968);
      }
      to {
        opacity: 1;
        transform: translate3d(0, 0, 0) scale(1);
      }
    }

    /* Tablet Media Queries */
    @media (min-width: 620px) and (max-width: 790px), (min-width: 620px) and (max-width: 1100px) and (orientation: portrait) {
      .header-actions {
        position: absolute;
        top: calc(100% + 12px);
        right: 0;
        width: min(324px, calc(100vw - 2 * var(--gutter-start)));
        background: linear-gradient(145deg, rgba(16,22,25,.92), rgba(8,14,17,.95));
        border: 1px solid rgba(255,255,255,.16);
        border-radius: 16px;
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 16px;
        box-shadow: 0 10px 30px rgba(0,0,0,.6);
        opacity: 0;
        visibility: hidden;
        transform: translateY(-8px) scale(.985);
        pointer-events: none;
        transition: opacity 220ms ease, transform 220ms ease, visibility 220ms;
        z-index: 50;
      }

      .header.menu-open .header-actions {
        opacity: 1;
        visibility: visible;
        transform: translateY(0) scale(1);
        pointer-events: auto;
      }

      .nav {
        margin-left: 0;
        top: 0;
        flex-direction: column;
        align-items: flex-start;
        gap: 14px;
        width: 100%;
      }

      .nav-link:first-child {
        top: 0;
      }

      .nav-link.active::after {
        left: 0;
        transform: none;
        bottom: -4px;
        width: 32px;
      }

      .time-panel {
        margin-left: 0;
        width: 100%;
        border-left: none;
        border-top: 1px solid rgba(255,255,255,.12);
        padding-top: 14px;
        padding-left: 0;
        height: auto;
      }

      .sign-up {
        margin-left: 0;
        width: 100%;
      }

      .menu-toggle {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-left: auto;
        width: 46px;
        height: 46px;
        border-radius: 11px;
        border: 1px solid rgba(255,255,255,.16);
        background: linear-gradient(145deg, rgba(26,34,36,.82), rgba(16,29,33,.88));
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        box-shadow: 0 2px 10px rgba(0,0,0,.4);
        cursor: pointer;
        position: relative;
        top: -1px;
      }

      .menu-toggle-icon {
        width: 20px;
        height: 14px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }

      .menu-toggle-bar {
        width: 100%;
        height: 2px;
        background: #fff;
        border-radius: 1px;
        transition: transform 200ms ease, opacity 200ms ease;
        transform-origin: center;
      }

      .header.menu-open .menu-toggle-bar:first-child {
        transform: translateY(6px) rotate(45deg);
      }

      .header.menu-open .menu-toggle-bar:last-child {
        transform: translateY(-6px) rotate(-45deg);
      }
    }

    /* Mobile Media Query */
    @media (max-width: 619px) {
      :root {
        --gutter-start: 20px;
        --gutter-end: 20px;
        --hero-bottom: max(24px, env(safe-area-inset-bottom, 24px));
      }

      .header-actions {
        position: absolute;
        top: calc(100% + 12px);
        right: 0;
        width: min(340px, calc(100vw - 40px));
        background: linear-gradient(145deg, rgba(16,22,25,.94), rgba(8,14,17,.97));
        border: 1px solid rgba(255,255,255,.16);
        border-radius: 16px;
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 16px;
        box-shadow: 0 10px 30px rgba(0,0,0,.7);
        opacity: 0;
        visibility: hidden;
        transform: translateY(-8px) scale(.985);
        pointer-events: none;
        transition: opacity 220ms ease, transform 220ms ease, visibility 220ms;
        z-index: 50;
      }

      .header.menu-open .header-actions {
        opacity: 1;
        visibility: visible;
        transform: translateY(0) scale(1);
        pointer-events: auto;
      }

      .nav {
        margin-left: 0;
        top: 0;
        flex-direction: column;
        align-items: flex-start;
        gap: 14px;
        width: 100%;
      }

      .nav-link:first-child {
        top: 0;
      }

      .nav-link.active::after {
        left: 0;
        transform: none;
        bottom: -4px;
        width: 32px;
      }

      .time-panel {
        margin-left: 0;
        width: 100%;
        border-left: none;
        border-top: 1px solid rgba(255,255,255,.12);
        padding-top: 14px;
        padding-left: 0;
        height: auto;
      }

      .sign-up {
        margin-left: 0;
        width: 100%;
      }

      .menu-toggle {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-left: auto;
        width: 44px;
        height: 44px;
        border-radius: 11px;
        border: 1px solid rgba(255,255,255,.16);
        background: linear-gradient(145deg, rgba(26,34,36,.82), rgba(16,29,33,.88));
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        box-shadow: 0 2px 10px rgba(0,0,0,.4);
        cursor: pointer;
        position: relative;
        top: -1px;
      }

      .menu-toggle-icon {
        width: 18px;
        height: 12px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }

      .menu-toggle-bar {
        width: 100%;
        height: 2px;
        background: #fff;
        border-radius: 1px;
        transition: transform 200ms ease, opacity 200ms ease;
        transform-origin: center;
      }

      .header.menu-open .menu-toggle-bar:first-child {
        transform: translateY(5px) rotate(45deg);
      }

      .header.menu-open .menu-toggle-bar:last-child {
        transform: translateY(-5px) rotate(-45deg);
      }

      .line-one {
        transform: scaleX(.78);
      }

      .line-two {
        transform: scaleX(.55);
      }

      .hero-copy br {
        display: none;
      }

      .hero-copy {
        width: 100%;
        max-width: calc(100vw - 40px);
      }

      .demo-card {
        top: clamp(176px, 32svh, 300px);
        bottom: auto;
        right: var(--gutter-end);
      }
    }
  </style>
</head>
<body>
  <main class="viewport">
    <section class="screen" id="screen">
      
      <!-- Exact Mandatory CloudFront Background Video -->
      <video class="background" autoplay muted loop playsinline disablepictureinpicture aria-hidden="true">

  <script>
    (function() {
      // Clean up entrance animation pending state upon demo-card animation finish
      var demoCard = document.querySelector('.demo-card');
      if (demoCard) {
        demoCard.addEventListener('animationend', function(e) {
          if (e.animationName === 'entrance-card') {
            document.documentElement.classList.remove('motion-pending');
            if (window.__motionTimeout) {
              clearTimeout(window.__motionTimeout);
            }
          }
        });
      }

      // Mobile / Tablet hamburger menu toggle interaction
      var header = document.querySelector('.header');
      var menuToggle = document.querySelector('.menu-toggle');
      var tabletNav = document.getElementById('tablet-navigation');
      var navLinks = document.querySelectorAll('.nav-link');

      function toggleMenu() {
        var isOpen = header.classList.toggle('menu-open');
        menuToggle.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
        if (tabletNav) {
          if (window.innerWidth <= 1100 && !isOpen) {
            tabletNav.setAttribute('inert', '');
          } else {
            tabletNav.removeAttribute('inert');
          }
        }
        if (isOpen && navLinks.length > 0) {
          navLinks[0].focus();
        }
      }

      function closeMenu() {
        if (header.classList.contains('menu-open')) {
          header.classList.remove('menu-open');
          menuToggle.setAttribute('aria-expanded', 'false');
          if (tabletNav && window.innerWidth <= 1100) {
            tabletNav.setAttribute('inert', '');
          }
        }
      }

      if (menuToggle) {
        menuToggle.addEventListener('click', function(e) {
          e.stopPropagation();
          toggleMenu();
        });
      }

      // Close menu on outside click
      document.addEventListener('click', function(e) {
        if (header.classList.contains('menu-open')) {
          if (!header.contains(e.target)) {
            closeMenu();
          }
        }
      });

      // Close menu on Escape key
      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
          closeMenu();
        }
      });

      // Close menu when a link is clicked
      navLinks.forEach(function(link) {
        link.addEventListener('click', function() {
          closeMenu();
        });
      });

      // Manage inert on resize
      function handleResize() {
        if (tabletNav) {
          if (window.innerWidth <= 1100 && !header.classList.contains('menu-open')) {
            tabletNav.setAttribute('inert', '');
          } else {
            tabletNav.removeAttribute('inert');
          }
        }
      }
      window.addEventListener('resize', handleResize);
      handleResize();

      // Dynamic Live Accurate Clock
      var timeValue = document.querySelector('.time-value');
      function updateTime() {
        if (!timeValue) return;
        var now = new Date();
        var timeStr = now.toLocaleTimeString('en-US', {
          hour: 'numeric',
          minute: '2-digit',
          second: '2-digit',
          hour12: true
        });
        var dateStr = now.toLocaleDateString('en-US', {
          day: 'numeric',
          month: 'long',
          year: 'numeric'
        });
        timeValue.innerHTML = timeStr + '&nbsp; • &nbsp;' + dateStr;
      }
      updateTime();
      setInterval(updateTime, 1000);
    })();
  </script>
