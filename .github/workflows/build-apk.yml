name: Build RetailPulse Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: mobile/package.json

      - name: Install Mobile Dependencies
        working-directory: mobile
        run: npm install

      - name: Make Gradle Executable
        working-directory: mobile/android
        run: chmod +x gradlew

      - name: Build Android APK
        working-directory: mobile/android
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: ./gradlew assembleDebug --no-daemon

      - name: Prepare APK File
        run: |
          mkdir -p build-output
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk build-output/RetailPulse.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RetailPulse-Android-APK
          path: build-output/RetailPulse.apk
          retention-days: 30

      - name: Publish GitHub Release with APK Download
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0-apk
          name: "RetailPulse Mobile Android APK (v1.0.0)"
          body: |
            ## 📱 RetailPulse Mobile Android APK
            
            Installable Android APK build for RetailPulse SaaS Command Center.
            
            ### How to install on your phone:
            1. Download `RetailPulse.apk` below directly to your Android device.
            2. Tap on the downloaded file and select **Install**.
            3. (If prompted, allow **Install from Unknown Sources** in Android Settings).
            4. Open RetailPulse and enjoy real-time POS analytics and live SaaS stream!
          files: build-output/RetailPulse.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
